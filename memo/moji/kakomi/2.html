<p style="font-size: 24px; line-height: 1.8;">
  比較テスト：あ①<c-char>1</c-char><c-char>99</c-char><c-char>100</c-char>漢<c-char type="square">済</c-char><c-char type="square">重要</c-char>字
</p>

<script>
  class EnclosedChar extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
    }

    connectedCallback() {
      const type = this.getAttribute('type') || 'circle';
      const text = this.textContent.trim();
      
      // 半角を0.5、全角を1として視覚的な文字幅を概算
      const visualLength = [...text].reduce((acc, char) => {
        return acc + (char.match(/[^\x01-\x7E\uFF61-\uFF9F]/) ? 1 : 0.55);
      }, 0);

      let fontSize = 0.72;
      let scaleX = 1.0;

      if (visualLength > 1.5) {
        // 3桁数字(1.65)や全角2文字(2.0)の場合
        fontSize = 0.46;
        scaleX = 0.85;
      } else if (visualLength > 0.8) {
        // 2桁数字(1.1)や全角1文字(1.0)の場合
        fontSize = 0.62;
        scaleX = 0.95;
      }

      this.shadowRoot.innerHTML = `
        <style>
          :host {
            /* inline-blockにし、1em四方を厳密に確保 */
            display: inline-block;
            width: 1em;
            height: 1em;
            
            /* 日本語の全角文字と上下の中心をピタリと合わせる */
            vertical-align: -0.14em; /* text-bottom基準ではなくベースライン基準の正確な補正値 */
            
            border: 0.06em solid currentColor;
            border-radius: ${type === 'circle' ? '50%' : '0.12em'};
            box-sizing: border-box;
            
            /* 行間を広げない */
            line-height: 1;
            overflow: hidden;
            user-select: all;
          }

          /* 内部だけをflexにして上下左右の中央に配置 */
          .inner {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            
            font-size: ${fontSize}em;
            font-weight: 600;
            line-height: 1;
            letter-spacing: -0.05em;
            transform: scaleX(${scaleX});
            white-space: nowrap;
          }
        </style>
        <span class="inner"><slot></slot></span>
      `;
    }
  }

  customElements.define('c-char', EnclosedChar);
</script>
