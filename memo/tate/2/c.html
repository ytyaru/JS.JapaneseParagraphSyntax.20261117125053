<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
ol.kanji-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  grid-template-columns: max-content 1em 1fr;
}

ol.kanji-list > li {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: subgrid;
}

/* 1列目：番号（右寄せ） */
ol.kanji-list > li > .num {
  grid-column: 1;
  justify-self: end;
  display: inline-block;
  white-space: nowrap;
}

/* 1文字（全角1幅） */
ol.kanji-list > li > .num[data-len="1"] {
  width: 1em;
  text-align: center;
}

/* 2文字以上（1文字あたり半角幅に圧縮） */
ol.kanji-list > li > .num:not([data-len="1"]) {
  width: calc(var(--len) * 0.5em);
}
ol.kanji-list > li > .num:not([data-len="1"]) > span {
  display: inline-block;
  width: calc(var(--len) * 1em);
  transform: scaleX(0.5);
  transform-origin: right center;
}

/* 2列目：記号 */
ol.kanji-list > li > .sep {
  grid-column: 2;
}

/* 3列目：本文 */
ol.kanji-list > li > .txt {
  grid-column: 3;
}
</style>
</head>
<body>

<!-- 
  オプション指定（data属性で切り替え）:
  data-start="0" または "1"（開始番号）
  data-ten="single"（10を「十」にする） または "positional"（10を「一〇」にする）
-->
<ol class="kanji-list" data-start="1" data-ten="single">
  <li>最初の項目</li>
  <li>二番目の項目</li>
  <li>三番目の項目</li>
  <li>四番目の項目</li>
  <li>五番目の項目</li>
  <li>六番目の項目</li>
  <li>七番目の項目</li>
  <li>八番目の項目</li>
  <li>九番目の項目</li>
  <li>十番目の項目</li>
  <li>十一番目の項目</li>
</ol>

<script>
function toKanji(num, tenMode) {
  const digits = ["〇", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
  const units = ["", "万", "億", "兆", "京", "垓", "𥝱", "穣", "溝", "澗", "正", "載", "極"];
  if (num === 0) return digits;

  let res = "";
  let uIdx = 0;
  while (num > 0) {
    const chunk = num % 10000;
    if (chunk > 0) {
      let s = "";
      const d1000 = Math.floor(chunk / 1000);
      const d100  = Math.floor((chunk % 1000) / 100);
      const d10   = Math.floor((chunk % 100) / 10);
      const d1    = chunk % 10;

      if (d1000 > 0) s += (d1000 === 1 ? "" : digits[d1000]) + "千";
      if (d100 > 0)  s += (d100 === 1 ? "" : digits[d100]) + "百";

      if (tenMode === "single" && d10 === 1) {
        s += "十" + (d1 > 0 ? digits[d1] : "");
      } else if (d10 > 0) {
        s += digits[d10] + digits[d1];
      } else if (d1 > 0) {
        s += digits[d1];
      }
      res = s + units[uIdx] + res;
    }
    num = Math.floor(num / 10000);
    uIdx++;
  }
  return res;
}

document.querySelectorAll("ol.kanji-list").forEach(ol => {
  const start = parseInt(ol.dataset.start || "1", 10);
  const tenMode = ol.dataset.ten || "single";

  ol.querySelectorAll(":scope > li").forEach((li, i) => {
    const kanji = toKanji(start + i, tenMode);
    const len = [...kanji].length;
    const text = li.innerHTML;

    li.innerHTML = `<span class="num" data-len="${len}" style="--len:${len}"><span>${kanji}</span></span><span class="sep">．</span><span class="txt">${text}</span>`;
  });
});
</script>

</body>
</html>
